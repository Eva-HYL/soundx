# 基础服务：MySQL + Redis。
# 本地开发和生产都用这一份；生产需要 API 容器时，额外叠加 docker-compose.prod.yml。
#
# 用法：
#   cd deploy
#   cp .env.example .env           # 按需调整端口/密码
#   docker compose up -d           # 本地或服务器只跑 DB/Redis
#   docker compose logs -f mysql   # 看日志
#   docker compose down            # 停止（数据保留）
#   docker compose down -v         # 停止且清空数据（危险）

services:
  mysql:
    image: mysql:8.0
    container_name: soundx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-soundx}
      TZ: Asia/Shanghai
    # 生产建议关闭宿主机端口，改走 Docker 网络；本地开发放开便于 DBeaver/Prisma Studio 连
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=500
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-change-me}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: soundx-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: soundx-net
