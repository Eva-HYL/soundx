# 生产 overlay：在 docker-compose.yml 基础上追加 API 容器。
#
# 用法（在 deploy/ 目录）：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 如果 API 部署在另一台机器（本文件只用于 DB + Redis 时），不需要这份文件。
#
# 注意：首次启动 API 会自动 prisma migrate deploy 把 schema 推到 DB。
#       所以服务器上部署前要确保 prisma/migrations/ 已提交。

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: soundx-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      WX_APP_ID: ${WX_APP_ID:-}
      WX_APP_SECRET: ${WX_APP_SECRET:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-soundx-dev}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
